# Reusable environment block for every backend instance.
x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "8080"
  # Browser origins that talk to the API/WebSocket through the load balancer.
  CORS_ORIGIN: "http://localhost:8080,http://localhost:5173,http://localhost:8081"
  JWT_SECRET: "dev-only-jwt-secret-change-me"
  JWT_EXPIRES_IN: "12h"
  DATABASE_URL: "postgresql://collab:collab@postgres:5432/collab?schema=public"
  REDIS_URL: "redis://redis:6379"
  # Enable the cross-instance collaboration backplane + leader election.
  COLLAB_BUS: "redis"
  BUS_LEASE_MS: "10000"
  S3_ENDPOINT: "http://minio:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "collab-snapshots"
  S3_ACCESS_KEY_ID: "minioadmin"
  S3_SECRET_ACCESS_KEY: "minioadmin"
  S3_FORCE_PATH_STYLE: "true"
  PERSIST_FLUSH_MS: "5000"
  SNAPSHOT_INTERVAL_MS: "60000"
  ROOM_TTL_MS: "60000"
  FILE_HISTORY_LIMIT: "20"
  RESTORE_LOCK_MS: "30000"
  PRESENCE_TTL_SECONDS: "30"

x-backend-healthcheck: &backend-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-31-58Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/collab-snapshots;
      echo 'bucket collab-snapshots ready';
      "
    restart: "no"

  # Backend instance #1.
  backend-1:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3001:8080"
    healthcheck: *backend-healthcheck

  # Backend instance #2. Same Postgres/Redis/MinIO; document traffic for the
  # same fileId converges over Redis pub/sub with a single elected writer.
  backend-2:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3002:8080"
    healthcheck: *backend-healthcheck

  # Load balancer in front of BOTH backends: REST API and the y-websocket
  # upgrade share an upstream (ip_hash keeps a browser on one instance when
  # possible, but the bus works regardless of where a socket lands).
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/backend-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Static frontend; its own nginx proxies /api and /collab to BOTH backends
  # through the gateway so every browser request is load balanced.
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Two-browser collaboration E2E (Playwright).
  # Run with: docker compose --profile e2e up --build --abort-on-container-exit --exit-code-from e2e
  e2e:
    profiles: ["e2e"]
    build:
      context: ./e2e
    environment:
      E2E_BASE_URL: "http://frontend"
    depends_on:
      frontend:
        condition: service_healthy
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
